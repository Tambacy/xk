name: 报告问题
description: 程序没按预期工作时用这个
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把下面的信息填全 —— 这是个桌面程序，
        环境信息不全的话很难复现。

        > ⚠️ **不要在 Issue 里贴学号、密码或完整的诊断包**。
        > 日志已经自动脱敏，但请自己再确认一遍。

  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 窗口标题栏上就有，例如「选课助手 v0.4.0」
      placeholder: 选课助手 v0.4.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: 在「设置 → 系统 → 关于」里看，例如 Windows 11 24H2
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 出问题的环节
      options:
        - 登录 / 二次验证
        - 模式选择
        - 预定课程（查证、时间冲突）
        - 确认并启动
        - 运行监控（监听、抢课、日志）
        - 安装 / 卸载 / 启动
        - 界面显示
        - 其它
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么、期望什么、实际发生了什么
      placeholder: |
        1. 我点了……
        2. 期望……
        3. 实际……
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 相关日志
      description: |
        监控页右下角有「打开日志」，日志在 `%LOCALAPPDATA%\XkHelper\logs\`。
        贴出问题前后的那几十行即可。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我确认内容里**没有**学号、密码等个人信息
          required: true
        - label: 我已经看过 README 的「常见问题」一节
          required: false
